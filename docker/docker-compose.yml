services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ConnectionStrings__MealPlannerDb: Host=host.docker.internal;Port=5432;Database=meal_planner_db;Username=postgres;Password=admin
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
